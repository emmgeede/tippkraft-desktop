[package]
name = "tippkraft"
version = "0.1.0"
edition = "2024"

[dependencies]
evdev = "0.13.2"
rustix = { version = "1.1.6", features = ["event", "fs", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.1"
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9.0"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
