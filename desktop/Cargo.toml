[package]
name = "tippkraft"
version = "0.1.7"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "default_fonts"] }
egui = { version = "0.37.0", default-features = false }
evdev = "0.13.2"
ksni = { version = "0.3.7", features = ["blocking"] }
rustix = { version = "1.1.6", features = ["event", "fs", "pipe", "rand", "system", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = "0.9.0"
zbus = { version = "5.19.0", default-features = false, features = ["tokio", "blocking-api"] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
